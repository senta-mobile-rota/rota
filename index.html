<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTA Rota</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f5f7;
  color: #1f2937;
}

header {
  background: #17365d;
  color: white;
  padding: 20px 16px 14px;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 4px 0 0;
  opacity: 0.8;
  font-size: 14px;
}

.tabs {
  display: flex;
  background: white;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}

.tab {
  flex: 1;
  padding: 12px 4px;
  border: 0;
  background: white;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
}

.tab.active {
  background: #17365d;
  color: white;
}

.page {
  display: none;
  max-width: 850px;
  margin: auto;
  padding: 14px;
}

.page.active {
  display: block;
}

.card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 16px;
  overflow: hidden;
}

.person-title {
  padding: 14px 16px 6px;
  font-weight: bold;
  font-size: 18px;
}

.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px;
  background: #e9eef5;
}

.month-nav button {
  border: 0;
  background: #17365d;
  color: white;
  font-weight: bold;
  border-radius: 9px;
  padding: 8px 12px;
  cursor: pointer;
}

.month-title {
  font-weight: bold;
  text-align: center;
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 12px;
}

.weekday {
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  color: #667085;
  padding-bottom: 4px;
}

.day-box {
  min-height: 62px;
  border-radius: 9px;
  padding: 6px;
  background: #f7f8fa;
  border: 1px solid #e5e7eb;
}

.empty {
  background: transparent;
  border: none;
}

.day-number {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 5px;
}

.code {
  display: inline-block;
  padding: 4px 6px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
}

.dc { background: #dcfce7; color: #166534; }
.nc { background: #dbeafe; color: #1e40af; }
.rd { background: #eeeeee; color: #555; }
.f { background: #fef3c7; color: #92400e; }
.leave { background: #fde2e2; color: #991b1b; }

.notice {
  padding: 12px 14px;
  background: #fff7d6;
  border-radius: 10px;
  margin-bottom: 14px;
  font-size: 13px;
}

.manager-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.manager-table th,
.manager-table td {
  border: 1px solid #e5e7eb;
  padding: 8px;
  text-align: center;
}

.manager-table th {
  background: #eef2f6;
}

.manager-table td:first-child,
.manager-table th:first-child {
  text-align: left;
  font-weight: bold;
  position: sticky;
  left: 0;
  background: white;
}

.scroll {
  overflow-x: auto;
}

.daily-person {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 16px;
  border-top: 1px solid #eee;
}

.shift-badge {
  padding: 7px 10px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: bold;
}

footer {
  text-align: center;
  color: #777;
  font-size: 11px;
  padding: 18px;
}
</style>
</head>

<body>

<header>
  <h1>SENTA Rota</h1>
  <p>Mobile Staff Rota</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="showPage('myrota', this)">My Rota</button>
  <button class="tab" onclick="showPage('managerMonth', this)">Manager Month</button>
  <button class="tab" onclick="showPage('managerDay', this)">Manager Day</button>
</div>

<div id="myrota" class="page active">

  <div class="notice">
    Test data only
  </div>

  <div class="card">
    <div class="person-title">
    Rota line:
    <select id="rotaLineSelect" onchange="selectRotaLine(this.value)"></select>
</div>

    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div id="monthTitle" class="month-title"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>

    <div id="calendar" class="month-grid"></div>
  </div>
</div>

<div id="managerMonth" class="page">

    <div class="notice">
        Manager overview — live rota data
    </div>

    <div class="card">
        <div class="month-nav">
            <button onclick="changeManagerMonth(-1)">‹</button>
            <div id="managerMonthTitle" class="month-title"></div>
            <button onclick="changeManagerMonth(1)">›</button>
        </div>

        <div class="scroll">
            <table id="managerMonthTable" class="manager-table"></table>
        </div>
    </div>

</div>

<div id="managerDay" class="page">

    <div class="card">
        <div class="month-nav">
            <button onclick="changeManagerDay(-1)">‹</button>
            <div id="managerDayTitle" class="month-title"></div>
            <button onclick="changeManagerDay(1)">›</button>
        </div>

        <div id="managerDayList"></div>
    </div>

</div>

<footer>
  SENTA Mobile Rota Prototype
</footer>

<script>
function showPage(pageId, button) {
  document.querySelectorAll('.page').forEach(page => {
    page.classList.remove('active');
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });

  document.getElementById(pageId).classList.add('active');
  button.classList.add('active');
}

let testShifts = {};
let rotaRows = [];
let selectedRotaLine = "";

async function loadRota() {
    const response = await fetch("./rota.json?ts=" + Date.now());
    rotaRows = await response.json();

    const select = document.getElementById("rotaLineSelect");

    const rotaLines = [...new Set(
        rotaRows.map(row => row[2]).filter(Boolean)
    )].sort();

    select.innerHTML = "";

    rotaLines.forEach(line => {
        const option = document.createElement("option");
        option.value = line;
        option.textContent = line;
        select.appendChild(option);
    });

    selectedRotaLine = rotaLines.includes("AA1") ? "AA1" : rotaLines[0];
    select.value = selectedRotaLine;

    buildSelectedRota();
}

function selectRotaLine(line) {
    selectedRotaLine = line;
    buildSelectedRota();
}

function buildSelectedRota() {
    testShifts = {};

    rotaRows.forEach(row => {
        const date = row[0];
        const rotaLine = row[2];
        const shiftCode = row[5];

        if (rotaLine === selectedRotaLine && date && shiftCode) {
            const parts = date.split("/");
            const key = `${parts[2]}-${parts[1]}-${parts[0]}`;

            testShifts[key] = shiftCode;
        }
    });

    renderCalendar();
  renderManagerMonth();
  renderManagerDay();
}


loadRota();
  let managerYear = 2026;
let managerMonth = 7;

function changeManagerMonth(delta) {
    managerMonth += delta;

    if (managerMonth < 0) {
        managerMonth = 11;
        managerYear--;
    }

    if (managerMonth > 11) {
        managerMonth = 0;
        managerYear++;
    }

    renderManagerMonth();
}

function renderManagerMonth() {
    const title = document.getElementById("managerMonthTitle");
    const table = document.getElementById("managerMonthTable");

    if (!title || !table || !rotaRows.length) return;

    const monthName = new Date(managerYear, managerMonth, 1)
        .toLocaleString("en-GB", { month: "long", year: "numeric" });

    title.textContent = monthName + " — Team Overview";

    const daysInMonth = new Date(managerYear, managerMonth + 1, 0).getDate();

    const rotaLines = [...new Set(
        rotaRows.map(row => row[2]).filter(Boolean)
    )].sort();

    let html = "<tr><th>Rota line</th>";

    for (let day = 1; day <= daysInMonth; day++) {
        html += `<th>${day}</th>`;
    }

    html += "</tr>";

    rotaLines.forEach(line => {
        html += `<tr><td><strong>${line}</strong></td>`;

        for (let day = 1; day <= daysInMonth; day++) {
            const dd = String(day).padStart(2, "0");
            const mm = String(managerMonth + 1).padStart(2, "0");
            const yyyy = String(managerYear);

            const dateString = `${dd}/${mm}/${yyyy}`;

            const row = rotaRows.find(r =>
                r[0] === dateString &&
                r[2] === line
            );

            const code = row ? row[5] : "";

            html += `<td>${code}</td>`;
        }

        html += "</tr>";
    });

    table.innerHTML = html;
}
  let managerDayDate = new Date(2026, 7, 17);

function changeManagerDay(delta) {
    managerDayDate.setDate(managerDayDate.getDate() + delta);
    renderManagerDay();
}

function renderManagerDay() {
    const title = document.getElementById("managerDayTitle");
    const list = document.getElementById("managerDayList");

    if (!title || !list || !rotaRows.length) return;

    const dayName = managerDayDate.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    title.textContent = dayName;

    const dd = String(managerDayDate.getDate()).padStart(2, "0");
    const mm = String(managerDayDate.getMonth() + 1).padStart(2, "0");
    const yyyy = String(managerDayDate.getFullYear());

    const dateString = `${dd}/${mm}/${yyyy}`;

    const rowsForDay = rotaRows
        .filter(row => row[0] === dateString && row[2])
        .sort((a, b) => a[2].localeCompare(b[2]));

    let html = "";

    rowsForDay.forEach(row => {
        const rotaLine = row[2];
        const shiftCode = row[5];
        const status = row[6] || shiftCode || "";

        html += `
            <div class="daily-person">
                <strong>${rotaLine}</strong>
                <span class="shift-badge ${shiftClass(shiftCode)}">${status}</span>
            </div>
        `;
    });

    list.innerHTML = html || "<div class='daily-person'>No rota entries for this date</div>";
}
let currentYear = 2026;
let currentMonth = 7;

function shiftClass(code) {
  if (code === "DC") return "dc";
  if (code === "NC") return "nc";
  if (code === "RD") return "rd";
  if (code === "F") return "f";
  if (code === "Leave") return "leave";
  return "";
}

function renderCalendar() {
  const calendar = document.getElementById("calendar");
  const monthTitle = document.getElementById("monthTitle");

  calendar.innerHTML = "";

  const monthName = new Date(currentYear, currentMonth, 1)
    .toLocaleString("en-GB", { month: "long", year: "numeric" });

  monthTitle.textContent = monthName;

  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(day => {
    const d = document.createElement("div");
    d.className = "weekday";
    d.textContent = day;
    calendar.appendChild(d);
  });

  const firstDay = new Date(currentYear, currentMonth, 1);
  let offset = firstDay.getDay() - 1;
  if (offset < 0) offset = 6;

  for (let i = 0; i < offset; i++) {
    const blank = document.createElement("div");
    blank.className = "day-box empty";
    calendar.appendChild(blank);
  }

  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let day = 1; day <= daysInMonth; day++) {
    const box = document.createElement("div");
    box.className = "day-box";

    const num = document.createElement("div");
    num.className = "day-number";
    num.textContent = day;
    box.appendChild(num);

    const key =
      currentYear + "-" +
      String(currentMonth + 1).padStart(2, "0") + "-" +
      String(day).padStart(2, "0");

    const shift = testShifts[key];

    if (shift) {
      const badge = document.createElement("span");
      badge.className = "code " + shiftClass(shift);
      badge.textContent = shift;
      box.appendChild(badge);
    }

    calendar.appendChild(box);
  }
}

function changeMonth(amount) {
  currentMonth += amount;

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  renderCalendar();
}

renderCalendar();
</script>

</body>
</html>
